name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # bot state commits (every ~10 min) don't need a test run - only
    # human pushes and PRs do. They DO need to trigger a Pages rebuild,
    # which is why the bot commits no longer carry [skip ci].
    if: github.actor != 'paper-trading-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest tests/ -v --tb=short
