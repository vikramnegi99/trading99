name: Paper Trading Agent

# Automated scheduled paper-trading runs. PAPER TRADING ONLY - the code
# has real-money execution permanently disabled. Managed from mobile via
# the GitHub app: use "Run workflow" for manual runs, or view Actions logs.
on:
  schedule:
    - cron: "*/10 * * * *"   # every ~10 minutes (minimum GitHub allows)
  workflow_dispatch:          # manual run from the GitHub mobile app

permissions:
  contents: write             # needed to commit state + dashboard back

concurrency:
  group: paper-trading
  # never cancel a mid-flight run: it could lose that cycle's state before
  # the commit step (runs are short; overlap just queues)
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize state (first run only)
        run: |
          if [ ! -f data/trading.db ]; then
            python main.py --init
          fi

      - name: Backup state DB before any schema migration
        run: |
          # One-time backup taken on the runner immediately BEFORE the V2
          # code first opens the database (new tables are additive and
          # non-destructive, but the pre-migration state is preserved anyway).
          if [ -f data/trading.db ] && [ ! -f data/trading.db.bak-pre-v2 ]; then
            cp data/trading.db data/trading.db.bak-pre-v2
            echo "created data/trading.db.bak-pre-v2"
          else
            echo "backup already exists (or no db yet)"
          fi

      - name: Validate database integrity
        run: |
          python - <<'EOF'
          import sqlite3
          conn = sqlite3.connect("data/trading.db")
          ok = conn.execute("PRAGMA quick_check").fetchone()[0]
          print(f"db quick_check: {ok}")
          assert str(ok).lower() == "ok", "database integrity failure - refusing to trade"
          conn.close()
          EOF

      - name: Paper engine canary (isolated pipeline proof)
        run: python main.py --canary

      - name: Run one paper-trading scan cycle
        env:
          # Optional: set repo secret OPENAI_API_KEY to enable LLM analysis.
          # Keep AI_PROVIDER=heuristic for the free offline analyzer.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Kill switch: set repository VARIABLE KILL_SWITCH=true (Settings ->
          # Secrets and variables -> Actions -> Variables) to stop new trades
          # without touching the workflow file.
          KILL_SWITCH: ${{ vars.KILL_SWITCH }}
          # Min edge to enter a trade (repo VARIABLE, mobile-configurable).
          # Unset falls back to the code default (0.05).
          MIN_EDGE: ${{ vars.MIN_EDGE }}
          # Active strategy profile (repo VARIABLE): conservative | balanced |
          # experimental. Unset = conservative. Profiles only adjust decision
          # thresholds; hard risk caps always come from config defaults.
          STRATEGY: ${{ vars.STRATEGY }}
          # Optional shadow strategy (repo VARIABLE): evaluated and logged,
          # never executed. Must differ from STRATEGY.
          SHADOW_STRATEGY: ${{ vars.SHADOW_STRATEGY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            export AI_PROVIDER=openai
          fi
          # Never fail the workflow on a data-fetch hiccup - state is preserved.
          python main.py --once || echo "SCAN_FAILED_BUT_KEPT_STATE" >> $GITHUB_STEP_SUMMARY

      - name: Regenerate dashboard
        if: always()
        env:
          # keep the dashboard's header/system-health in sync with the
          # strategy actually used by the scan step
          STRATEGY: ${{ vars.STRATEGY }}
          SHADOW_STRATEGY: ${{ vars.SHADOW_STRATEGY }}
        run: |
          python main.py --dashboard
          # GitHub Pages serves index.html at the site root - keep it in
          # sync with the dashboard on every cycle.
          cp dashboard.html index.html

      - name: Commit state and dashboard
        if: always()
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "actions@github.com"
          # data/trading.db is the persistent state: the cycle ends with a WAL
          # checkpoint, so the .db file alone carries the full state.
          # index.html is the GitHub Pages entry point (same as dashboard.html).
          # No [skip ci]: Pages must rebuild when new state is pushed; the
          # Tests workflow skips bot pushes via its own actor guard.
          git add data/trading.db data/trading.db.bak-pre-v2 dashboard.html index.html || true
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "paper-trading state update"
            git push
          fi
